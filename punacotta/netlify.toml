[build]
  command       = "npm install --ignore-scripts && npm run build"
  publish       = "dist"
  functions     = "netlify/functions"

[build.environment]
  NODE_VERSION  = "20"

[functions]
  node_bundler  = "esbuild"

[functions."forecast-scheduled"]
  schedule = "0 8 * * *"

# API functions — must come before SPA catch-all
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# Landing page at root — force so it wins over /* catch-all
[[redirects]]
  from   = "/"
  to     = "/landing.html"
  status = 200
  force  = true

# Board of Arrivals
[[redirects]]
  from   = "/order"
  to     = "/index.html"
  status = 200

# App — all /app/* routes serve the SPA
[[redirects]]
  from   = "/app/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/app"
  to     = "/index.html"
  status = 200

# SPA fallback for hash-routed pages (invite, reset, verify tokens)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
